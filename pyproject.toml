[project]
name = "rowform"
# Single-sourced from `rowform.__version__` by [tool.hatch.version] below, so a
# release cannot ship a package whose metadata and `__version__` disagree.
dynamic = ["version"]
description = "SQLAlchemy's schema and SQL, compiled hydration, no instance state: a read path for high-throughput async Python services."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Victor Pierozan", email = "42821343+vipierozan99@users.noreply.github.com" },
]
keywords = ["sqlalchemy", "asyncpg", "psycopg", "sqlite", "async", "dataclasses", "codegen"]
# No `license` field and no `License ::` classifier: the repository carries no
# LICENSE file yet, and declaring one here would be metadata the repository does
# not back up. Add both together.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Database :: Front-Ends",
    "Typing :: Typed",
]
# SQLAlchemy is a hard, unconditional dependency: it compiles every statement and
# owns the schema. There is no standalone mode.
#
# The floor is 2.0.18, not 2.0: `AsyncpgEngine` reads `dialect._native_inet_types`
# and calls `_disable_asyncpg_inet_codecs`, and neither exists before then — the
# whole suite errors on 2.0.17 and passes on 2.0.18. CI resolves to this floor on
# every PR so the number stays a fact.
#
# The ceiling is because this library reads SQLAlchemy's *private* surface, and
# does so deliberately: `_generate_cache_key`, `CacheKey.bindparams`,
# `compiled._bind_processors`, `escaped_bind_names`,
# `_process_parameters_for_postcompile`, `positiontup`, `_limit_clause`,
# `_returning`, `SimpleResultMetaData`, `IteratorResult._source_supports_scalars`,
# `Column._copy`/`_set_type`/`_reset_memoizations` and `TypeEngine._isnull`
# (class-body columns, pinned by `tests/test_model.py::TestClassBodyReferences`),
# `util.await_only`, and the asyncpg adapter's `_started`/`_start_transaction`
# and `_asyncpg_error_translate` (pinned by `tests/test_driver_errors.py`).
# Those are the compiler and result internals — none of them carry a
# compatibility promise across a minor release, and a caller resolving to 2.1
# would find out at runtime rather than at install. Raise it deliberately, with
# the suite green, rather than by leaving it open.
dependencies = ["sqlalchemy>=2.0.18,<2.1"]

[project.urls]
Homepage = "https://github.com/vipierozan99/rowform"
Repository = "https://github.com/vipierozan99/rowform"
Issues = "https://github.com/vipierozan99/rowform/issues"
Documentation = "https://github.com/vipierozan99/rowform/blob/main/docs/GUIDE.md"
Benchmarks = "https://github.com/vipierozan99/rowform/blob/main/docs/BENCHMARKS.md"

[project.optional-dependencies]
asyncpg = ["asyncpg>=0.29"]
psycopg = ["psycopg[binary]>=3.1", "psycopg-pool>=3.2"]
sqlite = ["aiosqlite>=0.19"]
orjson = ["orjson>=3.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "rowform/__init__.py"

# The wheel is the library and nothing else. `py.typed` ships with it because it
# lives inside the package directory — without that marker a type checker ignores
# every annotation in here (PEP 561), which for this library would silently
# discard the whole point of the `fetch_all` overloads.
[tool.hatch.build.targets.wheel]
packages = ["rowform"]

# The sdist adds what someone rebuilding or auditing the library needs — the test
# suite and the design/benchmark docs — and leaves out the benchmark harness,
# recorded result logs and editor config, which are large and only meaningful
# inside a git checkout.
[tool.hatch.build.targets.sdist]
include = [
    "/rowform",
    "/tests",
    "/docs",
    "/README.md",
    "/pyproject.toml",
    "/pytest.ini",
    "/justfile",
]


[dependency-groups]
dev = [
    "aiosqlite>=0.19",
    "alembic>=1.18.5",
    "async-typer>=0.2.1",
    "asyncpg>=0.29",
    "basedpyright>=1.39.9",
    "coverage>=7.15.2",
    "hypothesis>=6.100",
    "orjson>=3.9",
    "psycopg-pool>=3.2",
    "psycopg[binary]>=3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "rich>=15.0.0",
    "ruff>=0.16.0",
]

# Contenders and load generators. Kept out of `dev` so a plain `uv sync` does not
# pull SQLAlchemy/FastAPI, but declared so that `just bench` is reproducible —
# previously these were a manual `pip install` line in the benchmark docs.
bench = [
    "fastapi>=0.115",
    "locust>=2.32",
    "psutil>=6.0",
    "rich>=13.0",
    # Matches the project floor, so a lowest-direct resolution installs one
    # SQLAlchemy rather than arguing about two.
    "sqlalchemy>=2.0.18",
    # async-typer 0.2.1 imports `typer.clear`, removed in typer 0.26 — cap until
    # async-typer publishes a release that drops it.
    "typer>=0.15,<0.26",
    "uvicorn[standard]>=0.34",
]



[tool.pyright]
typeCheckingMode = "standard"
enableExperimentalFeatures = true
reportIncompatibleVariableOverride = false
reportIncompatibleMethodOverride = false
reportUnnecessaryTypeIgnoreComment = "error"
include = ["rowform", "benchmarks", "tests/typing"]
extraPaths = ["."]


[tool.coverage.run]
source = ["rowform"]
branch = true

[tool.coverage.report]
# `...` bodies (abstract driver hooks, overload stubs) and TYPE_CHECKING blocks
# are declarations, not code paths — counting them would measure how many
# overloads `fetch_all` has rather than how much of the library runs.
exclude_also = [
    "if TYPE_CHECKING:",
    "@overload",
    '^\s*\.\.\.$',
]

[tool.ruff]
line-length = 100
preview = true

[tool.ruff.lint]
extend-select = ["E303", "TID", "S"]
ignore = [
    "E711",
    "PLC0414",
    "B008",
    "S101",    # assert is this codebase's idiom for internal invariants/type-narrowing, never auth/permission checks
]
task-tags = ["TODO", "FIXME", "XXX", "NOTE"]

[tool.ruff.lint.per-file-ignores]
# Dev-only scripts, never shipped or run against untrusted input: hardcoded table
# names and exec() are the same codegen the library itself uses (see rowform/compile.py),
# random.Random seeds synthetic benchmark data, and subprocess/except-Exception calls
# drive or clean up after local, hardcoded commands rather than user input.
"benchmarks/**" = ["DTZ001", "S102", "S110", "S311", "S404", "S603", "S607", "S608", "BLE001", "PLW1510"]
# Naive datetimes are the point, not an oversight: sqlite stores DATETIME as a
# string with no zone, and the type-fidelity tests assert exactly what comes back.
# RUF012 fires on `metadata = MetaData()`, which is how a Base is declared.
# The subprocess call runs `uv run basedpyright` on a hardcoded path.
"tests/**" = ["DTZ001", "RUF012", "S404", "S603", "S607"]
# Deliberate mistakes, each asserted by a `# pyright: ignore` the checker
# verifies is necessary. The assignment *is* the assertion, so it is never read.
"tests/typing/negative.py" = ["B015", "B018", "F841", "RUF059"]
