name: CI

on:
  pull_request:
    branches: [main]
  # Also on push, so main's own state is a measured fact rather than whatever the
  # last PR to run against it reported.
  push:
    branches: [main]

# Neither job writes anything back to the repository, so the token they get should
# not be able to. (benchmarks.yml declares its own, wider, set — it comments on an
# issue.)
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint and typecheck do not depend on the interpreter under test, so they run
  # once rather than once per matrix leg.
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        # Pinned exactly, unlike the other actions here: astral-sh/setup-uv
        # publishes floating major tags only up to v7, so `@v9` does not
        # resolve at all. Bump this by hand.
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          # Pin the interpreter so a new default in uv can't silently change what
          # CI runs against.
          python-version: "3.14"

      - name: Install just
        uses: extractions/setup-just@v4

      # --all-groups so basedpyright can resolve benchmarks/ imports (fastapi,
      # locust, typer, the profilers): pyproject `include` type-checks that tree,
      # and a missing import is a hard error in standard mode.
      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Lint
        run: just lint

      - name: Typecheck
        run: just typecheck

  test:
    runs-on: ubuntu-latest

    # The postgres half of the suite (see tests/conftest.py) connects to
    # 127.0.0.1:5432 with the default ROWFORM_TEST_DSN. `--pg-required` below
    # turns "unreachable" from a skip into a failure, so this service must match
    # that DSN: db rowform_bench, user/password postgres/postgres.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rowform_bench
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # tests/test_pgbouncer.py and test_migrations.py, in front of `postgres`: the
      # same images and settings as scripts/pgbouncer.sh, which runs them locally.
      pgbouncer-transaction-old:
        image: edoburu/pgbouncer:1.20.1-p0
        env: {DB_HOST: postgres, DB_NAME: rowform_bench, DB_USER: postgres, DB_PASSWORD: postgres, AUTH_TYPE: scram-sha-256, ADMIN_USERS: postgres, POOL_MODE: transaction, MAX_PREPARED_STATEMENTS: "0", DEFAULT_POOL_SIZE: "4", SERVER_ROUND_ROBIN: "1"}
        ports:
          - 6431:5432
      pgbouncer-transaction:
        image: edoburu/pgbouncer:1.22.1-p0
        env: {DB_HOST: postgres, DB_NAME: rowform_bench, DB_USER: postgres, DB_PASSWORD: postgres, AUTH_TYPE: scram-sha-256, ADMIN_USERS: postgres, POOL_MODE: transaction, MAX_PREPARED_STATEMENTS: "100", DEFAULT_POOL_SIZE: "4", SERVER_ROUND_ROBIN: "1"}
        ports:
          - 6432:5432
      pgbouncer-session:
        image: edoburu/pgbouncer:1.22.1-p0
        env: {DB_HOST: postgres, DB_NAME: rowform_bench, DB_USER: postgres, DB_PASSWORD: postgres, AUTH_TYPE: scram-sha-256, ADMIN_USERS: postgres, POOL_MODE: session, MAX_PREPARED_STATEMENTS: "0", DEFAULT_POOL_SIZE: "4", SERVER_ROUND_ROBIN: "1"}
        ports:
          - 6433:5432

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Test (incl. postgres)
        run: just test . --pg-required

  # The floors in pyproject are a promise to anyone resolving against an older
  # environment, and an unverified one drifts: `sqlalchemy>=2.0` was wrong by 18
  # patch releases, because `AsyncpgEngine` reads dialect internals that only
  # appeared in 2.0.18. This job resolves every direct dependency to its declared
  # minimum and runs the suite there, so the numbers stay facts.
  floor:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rowform_bench
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # tests/test_pgbouncer.py and test_migrations.py, in front of `postgres`: the
      # same images and settings as scripts/pgbouncer.sh, which runs them locally.
      pgbouncer-transaction-old:
        image: edoburu/pgbouncer:1.20.1-p0
        env: {DB_HOST: postgres, DB_NAME: rowform_bench, DB_USER: postgres, DB_PASSWORD: postgres, AUTH_TYPE: scram-sha-256, ADMIN_USERS: postgres, POOL_MODE: transaction, MAX_PREPARED_STATEMENTS: "0", DEFAULT_POOL_SIZE: "4", SERVER_ROUND_ROBIN: "1"}
        ports:
          - 6431:5432
      pgbouncer-transaction:
        image: edoburu/pgbouncer:1.22.1-p0
        env: {DB_HOST: postgres, DB_NAME: rowform_bench, DB_USER: postgres, DB_PASSWORD: postgres, AUTH_TYPE: scram-sha-256, ADMIN_USERS: postgres, POOL_MODE: transaction, MAX_PREPARED_STATEMENTS: "100", DEFAULT_POOL_SIZE: "4", SERVER_ROUND_ROBIN: "1"}
        ports:
          - 6432:5432
      pgbouncer-session:
        image: edoburu/pgbouncer:1.22.1-p0
        env: {DB_HOST: postgres, DB_NAME: rowform_bench, DB_USER: postgres, DB_PASSWORD: postgres, AUTH_TYPE: scram-sha-256, ADMIN_USERS: postgres, POOL_MODE: session, MAX_PREPARED_STATEMENTS: "0", DEFAULT_POOL_SIZE: "4", SERVER_ROUND_ROBIN: "1"}
        ports:
          - 6433:5432

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          # 3.11, not 3.14 like the rest: the declared minimums predate 3.14
          # wheels (psycopg-binary 3.1.4 ships cp311 only), so this is the one
          # interpreter they install on.
          python-version: "3.11"

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Sync dependencies at their declared minimums
        run: uv sync --all-groups --resolution lowest-direct

      - name: Show what resolved
        run: |
          uv run --no-sync python -c "
          import sqlalchemy, pytest, asyncpg, aiosqlite, psycopg
          for m in (sqlalchemy, pytest, asyncpg, aiosqlite, psycopg):
              print(f'{m.__name__}=={m.__version__}')
          " | tee -a "$GITHUB_STEP_SUMMARY"

      # Tests only. Lint and typecheck run against the resolved versions in
      # `check`; pinning ruff and basedpyright to their floors here would report
      # on tooling nobody uses rather than on the library.
      - name: Test (incl. postgres)
        run: just test . --pg-required

  coverage:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rowform_bench
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # tests/test_pgbouncer.py and test_migrations.py, in front of `postgres`: the
      # same images and settings as scripts/pgbouncer.sh, which runs them locally.
      pgbouncer-transaction-old:
        image: edoburu/pgbouncer:1.20.1-p0
        env: {DB_HOST: postgres, DB_NAME: rowform_bench, DB_USER: postgres, DB_PASSWORD: postgres, AUTH_TYPE: scram-sha-256, ADMIN_USERS: postgres, POOL_MODE: transaction, MAX_PREPARED_STATEMENTS: "0", DEFAULT_POOL_SIZE: "4", SERVER_ROUND_ROBIN: "1"}
        ports:
          - 6431:5432
      pgbouncer-transaction:
        image: edoburu/pgbouncer:1.22.1-p0
        env: {DB_HOST: postgres, DB_NAME: rowform_bench, DB_USER: postgres, DB_PASSWORD: postgres, AUTH_TYPE: scram-sha-256, ADMIN_USERS: postgres, POOL_MODE: transaction, MAX_PREPARED_STATEMENTS: "100", DEFAULT_POOL_SIZE: "4", SERVER_ROUND_ROBIN: "1"}
        ports:
          - 6432:5432
      pgbouncer-session:
        image: edoburu/pgbouncer:1.22.1-p0
        env: {DB_HOST: postgres, DB_NAME: rowform_bench, DB_USER: postgres, DB_PASSWORD: postgres, AUTH_TYPE: scram-sha-256, ADMIN_USERS: postgres, POOL_MODE: session, MAX_PREPARED_STATEMENTS: "0", DEFAULT_POOL_SIZE: "4", SERVER_ROUND_ROBIN: "1"}
        ports:
          - 6433:5432

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Sync dependencies
        run: uv sync --all-groups

      # The gate sits below the measured figure (97% statements and branches) rather than
      # at it: a threshold set exactly at today's number fails on rounding and
      # teaches people to ignore the gate.
      - name: Coverage
        run: just cov --pg-required --cov-fail-under=90

  # Catches what the test suite structurally cannot: a wheel that builds but ships
  # without py.typed, or metadata PyPI would reject. Both were real gaps here.
  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Build sdist and wheel
        run: uv build

      - name: Validate metadata
        run: uvx twine check dist/*

      - name: Install the wheel and import it
        run: |
          uv venv /tmp/wheelcheck
          VIRTUAL_ENV=/tmp/wheelcheck uv pip install dist/*.whl
          /tmp/wheelcheck/bin/python -c "
          import pathlib, rowform
          assert (pathlib.Path(rowform.__file__).parent / 'py.typed').exists(), \
              'py.typed missing from the wheel: downstream checkers would ignore every annotation'
          print('rowform', rowform.__version__, 'installs and is typed')
          "
